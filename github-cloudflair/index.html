<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活型態評估量表 - 專業互動版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .gradient-bg { 
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #eff6ff 100%); 
            background-attachment: fixed;
        }
        .card { 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 1.5rem; 
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08); 
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
        }
        .sticky-header { 
            position: sticky; top: 0; z-index: 50; 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
        .category-title { 
            display: inline-block;
            background: #eff6ff;
            border-left: 4px solid #3b82f6; 
            padding: 0.5rem 1.2rem; 
            margin: 2.5rem 0 1.5rem; 
            font-weight: 700; 
            color: #1e40af; 
            border-radius: 0 0.75rem 0.75rem 0;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.1);
        }
        .illustration-box { 
            background: #f8fafc; 
            border: 2px dashed #cbd5e1; 
            border-radius: 1rem; 
            padding: 1.25rem; 
            margin-top: 1rem; 
            transition: all 0.3s ease;
        }
        .illustration-box:hover {
            border-color: #93c5fd;
            background: #eff6ff;
        }
        .input-field { 
            border: 1px solid #cbd5e1; 
            background-color: #f8fafc;
            border-radius: 0.75rem; 
            padding: 0.75rem 1rem; 
            width: 100%; 
            transition: all 0.2s ease; 
        }
        .input-field:focus { 
            outline: none; 
            border-color: #3b82f6; 
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); 
        }
        
        .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 漸層文字與按鈕 */
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(90deg, #1d4ed8, #3b82f6);
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(59, 130, 246, 0.5);
        }
        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        /* 自訂訊息框樣式 (Toast) */
        #toast {
            visibility: hidden;
            min-width: 280px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            color: #fff;
            text-align: center;
            border-radius: 9999px;
            padding: 16px 24px;
            position: fixed;
            z-index: 100;
            left: 50%;
            transform: translateX(-50%);
            bottom: 40px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }
        #toast.show {
            visibility: visible;
            animation: toast-fadein 0.5s cubic-bezier(0.16, 1, 0.3, 1), toast-fadeout 0.5s 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes toast-fadein { from { bottom: 0; opacity: 0; } to { bottom: 40px; opacity: 1; } }
        @keyframes toast-fadeout { from { bottom: 40px; opacity: 1; } to { bottom: 0; opacity: 0; } }

        /* 雷達圖容器 */
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        /* 自訂捲軸 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="gradient-bg min-h-screen pb-16">

    <!-- 提示訊息框 -->
    <div id="toast">✅ 評估資料已成功同步至試算表！</div>

    <!-- 導航與標題 -->
    <header class="sticky-header py-4 px-6 mb-10">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <h1 class="text-xl font-extrabold text-slate-800 tracking-wide">生活型態<span class="text-blue-600">評估</span></h1>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-sm font-medium text-slate-500">進度</span>
                <div id="progress-bar-container" class="w-24 md:w-32 h-2.5 bg-slate-200 rounded-full overflow-hidden shadow-inner">
                    <div id="progress-bar" class="h-full bg-blue-500 transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 md:px-6">
        <!-- 開始畫面 -->
        <section id="intro-screen" class="card p-8 md:p-12 text-center animate-slide-up">
            <div class="w-20 h-20 mx-auto bg-blue-50 rounded-full flex items-center justify-center mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
            </div>
            <h2 class="text-3xl md:text-4xl font-extrabold text-slate-800 mb-4 tracking-tight">了解您的<span class="text-gradient">生活型態</span></h2>
            <p class="text-slate-600 mb-8 leading-relaxed max-w-2xl mx-auto text-lg">
                本評估量表參考「臺灣生活型態醫學會 (TALM)」標準，旨在透過五大面向深度分析您的健康習慣。<br class="hidden md:block">
                請根據您過去 <strong class="text-blue-600 bg-blue-50 px-2 py-0.5 rounded">7 天</strong> 的實際狀況作答。填寫完畢後，系統將為您生成專屬雷達圖與個人化建議。
            </p>
            <div class="mb-10 p-5 bg-amber-50 rounded-2xl border border-amber-100 text-left text-sm text-amber-800 flex items-start gap-3 max-w-2xl mx-auto">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                <p><strong>隱私保障聲明：</strong> 您的填答資料將安全地同步至臨床專用試算表，僅供個人分析與醫療參考使用，請安心填寫。</p>
            </div>
            <button onclick="startQuiz()" class="btn-primary text-white font-bold py-4 px-14 rounded-full text-lg w-full md:w-auto">
                開始評估之旅
            </button>
        </section>

        <!-- 問卷表單 -->
        <form id="quizForm" class="hidden space-y-8">
            <!-- 基本資訊區塊 -->
            <div class="card p-6 md:p-8 border-t-4 border-t-blue-500 animate-slide-up" style="animation-delay: 0.1s;">
                <div class="flex items-center gap-2 mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                    <h3 class="font-bold text-xl text-slate-800">基本資料</h3>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-3 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">姓名 <span class="text-red-500">*</span></label>
                        <input type="text" name="userName" class="input-field" placeholder="請輸入姓名" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">年齡 <span class="text-red-500">*</span></label>
                        <input type="number" name="userAge" class="input-field" placeholder="請輸入年齡" min="0" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">病歷號碼 <span class="text-red-500">*</span></label>
                        <input type="text" name="medicalId" class="input-field" placeholder="請輸入病歷號" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">科別 <span class="text-red-500">*</span></label>
                        <select name="department" class="input-field" required>
                            <option value="" disabled selected>請選擇科別</option>
                            <option value="心內">心內</option>
                            <option value="神內">神內</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">收案類別 <span class="text-red-500">*</span></label>
                        <select name="caseType" class="input-field" required>
                            <option value="" disabled selected>請選擇類別</option>
                            <option value="新收案">新收案</option>
                            <option value="追蹤1">追蹤1</option>
                            <option value="追蹤2">追蹤2</option>
                            <option value="追蹤3">追蹤3</option>
                            <option value="追蹤4">追蹤4</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">腰圍 (公分) <span class="text-xs font-normal text-slate-400 ml-1">(選填)</span></label>
                        <input type="number" name="waistline" class="input-field" placeholder="請輸入腰圍" min="0" step="0.1">
                    </div>
                </div>
                <div class="pt-2 border-t border-slate-100">
                    <p class="text-sm font-semibold text-slate-700 mb-3">您的性別 <span class="text-red-500">*</span> <span class="text-xs font-normal text-slate-400 ml-2">(影響酒精攝取量評分標準)</span></p>
                    <div class="flex gap-4">
                        <label class="flex-1 max-w-[150px] relative cursor-pointer group">
                            <input type="radio" name="gender" value="male" class="peer sr-only" onchange="updateProgress()">
                            <div class="py-3 px-4 rounded-xl border-2 border-slate-200 bg-slate-50 text-center font-medium text-slate-600 transition-all duration-200 peer-checked:border-blue-500 peer-checked:bg-blue-50 peer-checked:text-blue-700 group-hover:bg-slate-100 group-hover:border-slate-300">
                                男性
                            </div>
                        </label>
                        <label class="flex-1 max-w-[150px] relative cursor-pointer group">
                            <input type="radio" name="gender" value="female" class="peer sr-only" onchange="updateProgress()">
                            <div class="py-3 px-4 rounded-xl border-2 border-slate-200 bg-slate-50 text-center font-medium text-slate-600 transition-all duration-200 peer-checked:border-rose-500 peer-checked:bg-rose-50 peer-checked:text-rose-700 group-hover:bg-slate-100 group-hover:border-slate-300">
                                女性
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <div id="questions-container" class="space-y-6"></div>

            <div class="pt-8 pb-12 animate-fade-in" style="animation-delay: 0.5s;">
                <button type="submit" id="submitBtn" class="btn-primary w-full text-white font-bold py-5 rounded-2xl shadow-xl transition-all disabled:opacity-70 disabled:cursor-not-allowed text-lg tracking-wide flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                    提交評估，查看我的雷達圖
                </button>
            </div>
        </form>

        <!-- 結果報告 -->
        <section id="result-screen" class="hidden space-y-8">
            <!-- 分數與圖表卡片 -->
            <div class="card p-8 md:p-10 animate-slide-up">
                <div class="text-center mb-10">
                    <h2 class="text-3xl font-extrabold text-slate-800 mb-2">專屬評估報告</h2>
                    <p class="text-slate-500">以下是根據您過去 7 天的習慣所生成的五大面向分析</p>
                </div>
                
                <div class="flex flex-col md:flex-row justify-around items-center gap-12">
                    <!-- 總分圓環 -->
                    <div class="flex flex-col items-center">
                        <div class="relative mb-6">
                            <svg class="w-56 h-56 transform -rotate-90">
                                <!-- 背景圓環 -->
                                <circle class="text-slate-100" stroke-width="16" stroke="currentColor" fill="transparent" r="90" cx="112" cy="112" />
                                <!-- 進度圓環 -->
                                <circle id="score-circle" class="text-blue-500 transition-all duration-1500 ease-out" stroke-width="16" stroke-dasharray="565.48" stroke-dashoffset="565.48" stroke-linecap="round" stroke="currentColor" fill="transparent" r="90" cx="112" cy="112" />
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                <span class="text-sm font-medium text-slate-400 mb-1">健康總分</span>
                                <div class="flex items-baseline">
                                    <span id="display-score" class="text-6xl font-black text-slate-800">0</span>
                                    <span class="text-xl font-bold text-slate-400 ml-1">/ 50</span>
                                </div>
                            </div>
                        </div>
                        <div id="level-badge" class="px-8 py-2.5 rounded-full text-white font-bold text-lg shadow-md transition-all">
                            計算中...
                        </div>
                    </div>

                    <!-- 雷達圖 -->
                    <div class="chart-container bg-slate-50/50 rounded-3xl p-4 border border-slate-100">
                        <canvas id="radarChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 建議卡片 -->
            <div class="card p-8 md:p-10 animate-slide-up" style="animation-delay: 0.2s;">
                <div class="flex items-center gap-3 mb-8 pb-4 border-b border-slate-100">
                    <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-xl shadow-inner">💡</div>
                    <h3 class="text-2xl font-extrabold text-slate-800">個人化健康指引</h3>
                </div>
                <div id="suggestions-content" class="space-y-5">
                    <!-- 建議將由此生成 -->
                </div>
            </div>

            <!-- 填答紀錄卡片 (衛教用) -->
            <div class="card p-8 md:p-10 animate-slide-up" style="animation-delay: 0.3s;">
                <div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100">
                    <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xl shadow-inner">📋</div>
                    <h3 class="text-2xl font-extrabold text-slate-800">填答紀錄回顧</h3>
                </div>
                <div id="answer-summary-content" class="max-h-96 overflow-y-auto pr-2 custom-scrollbar space-y-3 text-left">
                    <!-- 紀錄將由此生成 -->
                </div>
            </div>

            <div class="text-center pt-4 pb-12 animate-fade-in" style="animation-delay: 0.4s;">
                <button onclick="window.location.reload()" class="inline-flex items-center gap-2 text-slate-500 font-bold hover:text-blue-600 transition-colors bg-white px-6 py-3 rounded-full shadow-sm border border-slate-200 hover:shadow">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    重新進行測驗
                </button>
            </div>
        </section>
    </main>

    <script>
        // 設定 API 網址
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8uZUXXuToOHbVLKreAYQ17jSgOpX06iXxbcr-gKoVUJkCPbFMZTeQuQ9AWDsAzCjJ-A/exec"; 

        const categories = {
            social: { title: "正向社會連結與靈性", color: "#3b82f6", questions: [1, 3, 5, 7, 9] },
            nutrition: { title: "營養與原型食物", color: "#10b981", questions: [2, 12, 14, 18, 20, 21] },
            activity: { title: "身體活動與久坐行為", color: "#f59e0b", questions: [13, 19, 22] },
            substance: { title: "避免危害物質 (菸酒檳)", color: "#ef4444", questions: [6, 11, 15, 16] },
            stress: { title: "睡眠與壓力管理", color: "#8b5cf6", questions: [4, 8, 10, 17] }
        };

        const questionsData = [
            { id: 1, cat: 'social', text: "我感覺生活有目標", desc: "", options: {"是": 2, "否": 0} },
            { id: 2, cat: 'nutrition', text: "日常飲食會避免油炸，多以清蒸、水煮、涼拌、烘烤為主", desc: "", options: {"是": 1, "否": 0} },
            { id: 3, cat: 'social', text: "過去七天中有兩次以上參加靈性、宗教、或民俗活動", desc: "例如冥想、靜坐、祈禱、拜拜、參加宗教活動、祭拜家中神明或祖先等。", options: {"是": 2, "否": 0} },
            { id: 4, cat: 'stress', text: "大部分時間我覺得自己能處理各種壓力？", desc: "", options: {"是": 2, "否": 0} },
            { id: 5, cat: 'social', text: "我有參加社區團體、興趣班、讀書會或宗教團體的聚會與活動？", desc: "例如運動、社區、社團、學校團體等。", options: {"是": 2, "否": 0} },
            { id: 6, cat: 'substance', text: "我有抽菸、使用電子煙或其他菸品？", desc: "", options: {"無": 5, "偶爾交際應酬": 0, "平均一天約吸10支菸以下": 0, "平均一天約吸10支菸(含)以上": 0} },
            { id: 7, cat: 'social', text: "我有和家人或朋友相聚或聊天三次以上？", desc: "", options: {"是": 2, "否": 0} },
            { id: 8, cat: 'stress', text: "通常我在睡醒後覺得精神很好，覺得休息夠了？", desc: "", options: {"是": 2, "否": 0} },
            { id: 9, cat: 'social', text: "過去七天中，我共花了兩小時以上待在大自然中或在綠地活動？", desc: "例如：城市內外開放空間：公園、森林、海邊等。", options: {"是": 2, "否": 0} },
            { id: 10, cat: 'stress', text: "我覺得我有足夠的時間照顧自己，並且有適當的休息？", desc: "", options: {"是": 1, "否": 0} },
            { id: 11, cat: 'substance', text: "我有嚼檳榔？", desc: "", options: {"無": 1, "偶爾交際應酬(每週1-2天)": 0, "經常嚼或習慣在嚼(每週>2天)": 0} },
            { id: 12, cat: 'nutrition', text: "我的飲食大多以原型食物為主。", desc: "如新鮮蔬果、全穀、未加工肉類。", options: {"是": 1, "否": 0} },
            { id: 13, cat: 'activity', text: "過去七天中，我總共進行了幾天的肌力訓練？", desc: "例如伏地挺身、深蹲、引體向上等。", options: {"0天": 0, "1天": 1, "2天以上": 2} },
            { id: 14, cat: 'nutrition', text: "過去七天中，我總共喝了幾杯含糖飲料？", desc: "", options: {"0-1杯": 2, "2杯以上": 0} },
            { id: '15-1', cat: 'substance', text: "我有喝酒？", desc: "此題不計分", options: {"無": 0, "偶爾交際應酬(每週1-2天)": 0, "經常喝(每週>2天)": 0} },
            { id: '15-2', cat: 'substance', text: "過去七天，我一天中喝下含有酒精的飲料，最多共有幾單位？", desc: "", isImage: 'alcohol', options: {"男<=4, 女<=3": 2, "男>4, 女>3": 0} },
            { id: 16, cat: 'substance', text: "過去七天，以有喝酒精飲料的那幾天來算，我每天平均喝幾單位？", desc: "如果過去七天都沒有喝酒精飲料，請選「男<=2, 女<=1」。", options: {"男<=2, 女<=1": 2, "男>2, 女>1": 0} },
            { id: 17, cat: 'stress', text: "過去七天，我每晚大約睡幾個小時？", desc: "", options: {"6小時及以下": 0, "7小時": 3, "8小時及以上": 5} },
            { id: 18, cat: 'nutrition', text: "過去七天，我每天平均吃幾份水果？", desc: "1份是1拳頭大小或一碗8分滿。", isImage: 'fruit', options: {"少於1份": 0, "1份": 1, "2份以上": 2} },
            { id: 19, cat: 'activity', text: "過去七天，我每天坐著的總時間大約多久？", desc: "", options: {"5小時及以下": 3, "6-7小時": 1, "8小時及以上": 0} },
            { id: 20, cat: 'nutrition', text: "過去七天，我每天平均食用包裝零食的包數？", desc: "", options: {"1包以下": 2, "2包以上": 0} },
            { id: 21, cat: 'nutrition', text: "過去七天，我每天平均食用蔬菜的份數？", desc: "1份為可食重約100公克。", isImage: 'veggie', options: {"少於1份": 0, "1及2份": 1, "3份以上": 2} },
            { id: 22, cat: 'activity', text: "過去七天，我累積的有氧運動時間，總共有幾分鐘？", desc: "例如快走、慢跑等。", options: {"小於30": 0, "30-45": 1, " 60 ": 2, " 90 ": 3, " 120 ": 4, "150以上": 5} }
        ];

        const illustrations = {
            alcohol: `<div class="illustration-box flex flex-col items-center">
                <p class="text-sm font-bold text-slate-500 mb-3 tracking-wide">【酒精標準單位示意圖】</p>
                <img src="https://i.postimg.cc/MTQBdp4h/Q15-jiu-jing.jpg" alt="酒精標準單位示意圖" class="w-full max-w-sm rounded-lg object-contain shadow-sm">
            </div>`,
            fruit: `<div class="illustration-box flex flex-col items-center">
                <p class="text-sm font-bold text-slate-500 mb-3 tracking-wide">【水果一份是多少？】</p>
                <img src="https://i.postimg.cc/595Y0TMv/Q18-shui-guo.jpg" alt="水果一份是多少？" class="w-full max-w-sm rounded-lg object-contain shadow-sm">
            </div>`,
            veggie: `<div class="illustration-box flex flex-col items-center">
                <p class="text-sm font-bold text-slate-500 mb-3 tracking-wide">【蔬菜一份是多少？】</p>
                <img src="https://i.postimg.cc/RZYqyzcc/Q21-shu-cai.jpg" alt="蔬菜一份是多少？" class="w-full max-w-sm rounded-lg object-contain shadow-sm">
            </div>`
        };

        const notebookLMAdvice = {
            social: { title: "強化社會連結建議", tips: ["試著每周規劃一次與老友或家人的深度談話，而不僅是傳訊息。", "尋找一個感興趣的實體社團（如運動或讀書會），每周參與一次能顯著提升歸屬感。", "多親近自然環境，大自然能降低與孤獨感相關的皮質醇水平。"] },
            nutrition: { title: "優化營養習慣建議", tips: ["採用『我的餐盤』概念：每餐蔬菜佔一半，並確保有不同顏色的蔬菜。", "儘量減少含糖飲料，試著用無糖氣泡水或添加檸檬片的水代替。", "增加豆類與全穀類攝取，這些是提供持續能量的最佳來源。"] },
            activity: { title: "增加身體活動建議", tips: ["每坐 50 分鐘，請站起來活動 5 分鐘，這對代謝健康至關重要。", "如果您還沒有肌力訓練習慣，從每周兩次、每次 10 分鐘的居家徒手訓練開始。", "中強度運動是指您運動時『能說話但不能唱歌』的程度，請確保每周累積至少 150 分鐘。"] },
            substance: { title: "避免危害物質建議", tips: ["即使是少量菸品也會對心血管造成負擔，建議尋求專業戒菸輔導。", "若有飲酒習慣，請務必嚴守每日建議量，並規劃每周至少兩天『無酒日』。", "遠離環境中毒害，包含二手菸與高度加工食品中的化學添加劑。"] },
            stress: { title: "優化睡眠與壓力管理建議", tips: ["嘗試睡前 1 小時遠離螢幕，這能讓體內褪黑激素正常分泌。", "練習 4-7-8 呼吸法（吸氣4秒、憋氣7秒、吐氣8秒）來調節自律神經。", "固定上床與起床時間，包含周末，這能建立強大的生理時鐘。"] }
        };

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function startQuiz() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('quizForm').classList.remove('hidden');
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            let currentCat = '';
            let delayCount = 0;
            
            questionsData.forEach((q) => {
                if (q.cat !== currentCat) {
                    currentCat = q.cat;
                    const header = document.createElement('div');
                    header.className = 'category-title text-xl animate-slide-up';
                    header.style.animationDelay = `${delayCount * 0.05}s`;
                    header.innerText = categories[currentCat].title;
                    container.appendChild(header);
                }

                const card = document.createElement('div');
                card.className = 'card p-6 md:p-8 mb-6 animate-slide-up transition-all hover:shadow-lg';
                card.style.animationDelay = `${delayCount * 0.05}s`;
                delayCount++;
                
                let optionsHtml = '';
                Object.entries(q.options).forEach(([label, value]) => {
                    optionsHtml += `
                        <label class="flex-1 relative cursor-pointer group min-w-[120px]">
                            <input type="radio" name="q${q.id}" value="${value}" data-label="${label}" class="peer sr-only" onchange="updateProgress()">
                            <div class="h-full flex items-center justify-center p-4 rounded-xl border-2 border-slate-100 bg-white text-slate-600 font-medium transition-all duration-200 ease-out group-hover:border-blue-200 group-hover:bg-slate-50 peer-checked:border-blue-500 peer-checked:bg-blue-50 peer-checked:text-blue-700 peer-checked:shadow-sm">
                                ${label}
                            </div>
                        </label>
                    `;
                });

                card.innerHTML = `
                    <div class="flex items-start gap-4 mb-4">
                        <span class="bg-blue-600 text-white text-sm font-bold px-3 py-1 rounded-lg shrink-0 shadow-sm mt-0.5">Q${q.id}</span>
                        <div class="flex-1">
                            <p class="font-bold text-slate-800 text-lg leading-relaxed">${q.text}</p>
                            ${q.desc ? `<p class="text-sm text-slate-500 mt-1.5 flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>${q.desc}</p>` : ''}
                        </div>
                    </div>
                    ${q.isImage ? illustrations[q.isImage] : ''}
                    <div class="flex flex-wrap gap-3 mt-6">
                        ${optionsHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateProgress() {
            const totalQuestions = questionsData.length;
            const answeredNames = new Set();
            document.querySelectorAll('input[type="radio"]:checked').forEach(input => {
                if (input.name !== 'gender') answeredNames.add(input.name);
            });
            
            const percent = (answeredNames.size / totalQuestions) * 100;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        let radarChart = null;

        document.getElementById('quizForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            // 檢查是否所有單選題都有填寫，並記錄缺漏項目
            let missingItems = [];
            
            if (!formData.get('gender')) {
                missingItems.push("性別");
            }
            
            questionsData.forEach(q => {
                if (!formData.get(`q${q.id}`)) {
                    missingItems.push(`第${q.id}題`);
                }
            });

            if (missingItems.length > 0) {
                alert(`您還有項目尚未填寫完成：\n\n${missingItems.join('、')} 未填寫。\n\n請檢查並完成作答！`);
                return; 
            }

            // 狀態變更為傳送中
            const submitBtn = document.getElementById('submitBtn');
            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 資料分析與傳送中...`;

            const userData = {
                userName: formData.get('userName'),
                userAge: formData.get('userAge'),
                medicalId: formData.get('medicalId'),
                department: formData.get('department'),
                caseType: formData.get('caseType'),
                waistline: formData.get('waistline'),
                gender: formData.get('gender')
            };
            
            let catScores = { social: 0, nutrition: 0, activity: 0, substance: 0, stress: 0 };
            let rawAnswers = {};

            questionsData.forEach(q => {
                const score = parseInt(formData.get(`q${q.id}`));
                catScores[q.cat] += score;
                rawAnswers[`q${q.id}`] = score;
            });

            const totalScore = Object.values(catScores).reduce((a, b) => a + b, 0);

            // 切換畫面
            document.getElementById('quizForm').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // 執行數字動畫與圓環動畫
            const displayScoreObj = document.getElementById('display-score');
            let currentDisplay = 0;
            const targetScore = totalScore;
            const duration = 1500;
            const stepTime = Math.max(16, Math.floor(duration / targetScore));
            
            const timer = setInterval(() => {
                currentDisplay++;
                displayScoreObj.innerText = currentDisplay;
                if (currentDisplay >= targetScore) {
                    clearInterval(timer);
                    displayScoreObj.innerText = targetScore;
                }
            }, stepTime);

            const circle = document.getElementById('score-circle');
            const circumference = 565.48;
            setTimeout(() => {
                circle.style.strokeDashoffset = circumference - (totalScore / 50) * circumference;
            }, 100);

            // 判定等級並給予顏色
            const badge = document.getElementById('level-badge');
            if (totalScore >= 41) { 
                badge.innerText = "✨ 優秀：健康模範生"; 
                badge.className = "px-6 py-2 rounded-full text-white font-bold text-lg shadow-md bg-gradient-to-r from-emerald-400 to-emerald-500"; 
                circle.classList.replace('text-blue-500', 'text-emerald-400');
            }
            else if (totalScore >= 31) { 
                badge.innerText = "🌟 良好：具備健康意識"; 
                badge.className = "px-6 py-2 rounded-full text-white font-bold text-lg shadow-md bg-gradient-to-r from-blue-400 to-blue-500"; 
            }
            else if (totalScore >= 21) { 
                badge.innerText = "📈 普通：仍有改善空間"; 
                badge.className = "px-6 py-2 rounded-full text-white font-bold text-lg shadow-md bg-gradient-to-r from-amber-400 to-amber-500"; 
                circle.classList.replace('text-blue-500', 'text-amber-400');
            }
            else { 
                badge.innerText = "⚠️ 警示：需積極調整"; 
                badge.className = "px-6 py-2 rounded-full text-white font-bold text-lg shadow-md bg-gradient-to-r from-rose-400 to-rose-500"; 
                circle.classList.replace('text-blue-500', 'text-rose-400');
            }

            // 繪製高級雷達圖
            const ctx = document.getElementById('radarChart').getContext('2d');
            if(radarChart) radarChart.destroy();
            
            let radarColor = '59, 130, 246'; // Blue
            if (totalScore >= 41) radarColor = '16, 185, 129'; // Emerald
            else if (totalScore < 21) radarColor = '244, 63, 94'; // Rose

            radarChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['社會連結', '營養飲食', '身體活動', '危害物質管理', '壓力睡眠'],
                    datasets: [{
                        data: [catScores.social, catScores.nutrition, catScores.activity, catScores.substance, catScores.stress],
                        backgroundColor: `rgba(${radarColor}, 0.25)`,
                        borderColor: `rgb(${radarColor})`,
                        borderWidth: 2,
                        pointBackgroundColor: `rgb(${radarColor})`,
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: `rgb(${radarColor})`,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: { 
                    scales: { 
                        r: { 
                            min: 0, 
                            max: 10, 
                            ticks: { display: false, stepSize: 2 },
                            grid: { color: 'rgba(0,0,0,0.06)' },
                            angleLines: { color: 'rgba(0,0,0,0.06)' },
                            pointLabels: {
                                font: { size: 13, family: "'Noto Sans TC', sans-serif", weight: 'bold' },
                                color: '#475569'
                            }
                        } 
                    }, 
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleFont: { size: 14, family: "'Noto Sans TC', sans-serif" },
                            bodyFont: { size: 14, family: "'Noto Sans TC', sans-serif", weight: 'bold' },
                            padding: 12,
                            cornerRadius: 8,
                            displayColors: false,
                            callbacks: {
                                label: function(context) { return `得分: ${context.raw} / 10`; }
                            }
                        }
                    } 
                }
            });

            // 動態生成建議內容
            const suggestionsDiv = document.getElementById('suggestions-content');
            suggestionsDiv.innerHTML = "";
            let hasSuggestions = false;

            Object.keys(catScores).forEach((cat, index) => {
                if (catScores[cat] < 8) {
                    hasSuggestions = true;
                    const advice = notebookLMAdvice[cat];
                    const section = document.createElement('div');
                    section.className = "p-5 rounded-2xl bg-white border border-slate-100 shadow-sm relative overflow-hidden group hover:shadow-md transition-shadow";
                    
                    const decorLine = document.createElement('div');
                    decorLine.className = "absolute left-0 top-0 bottom-0 w-1.5 transition-all group-hover:w-2";
                    decorLine.style.backgroundColor = categories[cat].color;
                    section.appendChild(decorLine);

                    let tipsHtml = advice.tips.map(t => `<li class="flex items-start gap-2"><svg class="h-5 w-5 shrink-0 mt-0.5" style="color:${categories[cat].color}" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg><span>${t}</span></li>`).join("");
                    
                    const contentWrap = document.createElement('div');
                    contentWrap.className = "pl-4";
                    contentWrap.innerHTML = `<h4 class="font-extrabold text-slate-800 mb-3 text-lg">${advice.title}</h4><ul class="space-y-2.5 text-slate-600 leading-relaxed">${tipsHtml}</ul>`;
                    
                    section.appendChild(contentWrap);
                    suggestionsDiv.appendChild(section);
                }
            });

            if (!hasSuggestions) {
                suggestionsDiv.innerHTML = `
                    <div class="p-8 text-center bg-emerald-50 rounded-2xl border border-emerald-100">
                        <div class="text-4xl mb-3">🎉</div>
                        <h4 class="font-bold text-emerald-800 text-lg mb-2">太棒了！您的表現無可挑剔</h4>
                        <p class="text-emerald-600">您在五大面向皆取得了優異的成績，請繼續保持這個健康的生活型態！</p>
                    </div>
                `;
            }

            // 動態生成填答紀錄回顧
            const summaryDiv = document.getElementById('answer-summary-content');
            summaryDiv.innerHTML = "";
            questionsData.forEach(q => {
                const input = document.querySelector(`input[name="q${q.id}"]:checked`);
                const selectedLabel = input ? input.getAttribute('data-label') : '未作答';
                const scoreText = q.id === '15-1' ? '(不計分)' : `(${input ? input.value : 0}分)`;
                
                summaryDiv.innerHTML += `
                    <div class="p-3 bg-slate-50 rounded-lg border border-slate-100 flex flex-col md:flex-row md:items-center gap-2 md:gap-4 mb-2">
                        <div class="flex-1">
                            <span class="font-bold text-blue-600 mr-2">Q${q.id}.</span>
                            <span class="text-slate-700 text-sm font-medium">${q.text}</span>
                        </div>
                        <div class="shrink-0 flex items-center gap-2 md:justify-end">
                            <span class="px-3 py-1 bg-white border border-slate-200 rounded text-slate-700 text-sm font-bold shadow-sm">${selectedLabel}</span>
                            <span class="text-xs text-slate-400 min-w-[40px] text-right">${scoreText}</span>
                        </div>
                    </div>
                `;
            });

            // 取得指定題目的選項文字以傳送至後端
            const q6Label = document.querySelector('input[name="q6"]:checked')?.getAttribute('data-label') || '';
            const q15_1Label = document.querySelector('input[name="q15-1"]:checked')?.getAttribute('data-label') || '';
            const q11Label = document.querySelector('input[name="q11"]:checked')?.getAttribute('data-label') || '';

            // 傳送資料到 Google Sheets
            if (SCRIPT_URL) {
                const payload = {
                    timestamp: new Date().toLocaleString(),
                    ...userData,
                    total: totalScore,
                    categories: catScores,
                    details: rawAnswers,
                    labels: { q6: q6Label, q15_1: q15_1Label, q11: q11Label }
                };

                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                }).then(() => {
                    showToast("✅ 評估資料已成功同步至試算表！");
                }).catch(err => {
                    console.error("Transmission error:", err);
                    showToast("⚠️ 資料同步時發生異常，但結果已為您產出。");
                }).finally(() => {
                    submitBtn.innerHTML = originalBtnHtml; // 還原按鈕狀態
                });
            }
        };
    </script>
</body>
</html>
